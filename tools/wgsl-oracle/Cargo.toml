[package]
name = "wgsl-oracle"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in", "wgsl-out", "spv-in", "spv-out", "msl-out"] }
pollster = "=0.4.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
