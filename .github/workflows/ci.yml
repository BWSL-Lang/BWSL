name: CI

on:
  push:
    branches: [master]
    paths:
      - 'core/**'
      - 'phases/**'
      - 'tools/**'
      - 'modules/**'
      - 'tests/**'
      - 'vendor/**'
      - 'Makefile'
      - 'build.bat'
      - 'make.bat'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'phases/**'
      - 'tools/**'
      - 'modules/**'
      - 'tests/**'
      - 'vendor/**'
      - 'Makefile'
      - 'build.bat'
      - 'make.bat'
      - '.github/workflows/ci.yml'
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-latest

      - name: Install equivalence test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            glslang-tools libvulkan-dev mesa-vulkan-drivers
          dxc_archive="$RUNNER_TEMP/dxc.tar.gz"
          dxc_root="$RUNNER_TEMP/dxc"
          curl -fsSL \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.7.2308/linux_dxc_2023_08_14.x86_64.tar.gz \
            -o "$dxc_archive"
          mkdir -p "$dxc_root"
          tar -xzf "$dxc_archive" -C "$dxc_root"
          echo "$dxc_root/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$dxc_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build bwslc
        run: make build

      - name: Run regression tests
        run: make test

      - name: Build equivalence runner
        run: make equiv_runner

      - name: Run numerical equivalence tests
        run: python3 tests/run_tests.py --equivalence --no-spirv-val

  macos:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-latest

      - name: Build bwslc
        run: make build

      - name: Run regression tests
        run: make test

  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-sccache
            make

      - name: Build bwslc
        shell: msys2 {0}
        run: make build

      - name: Run regression tests
        shell: pwsh
        run: python tests/run_tests.py
