name: Release

on:
  push:
    tags: ['v*']
    branches: [master]

# Nightly builds share one rolling release, so a newer push supersedes an
# in-flight one. Tagged releases never cancel each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  linux:
    name: linux-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-latest-release

      - name: Compute version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "BWSL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # Commit date rather than wall clock, so every job agrees.
            date=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y%m%d)
            echo "BWSL_VERSION=nightly-$date-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld mingw-w64 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build bwslc (native linux/x64)
        env:
          CXX: ccache clang++
        run: make build

      - name: Build bwslc (cross linux/arm64)
        env:
          CXX: ccache clang++
        run: make build TARGET_OS=linux TARGET_ARCH=arm64

      - name: Build bwslc (cross windows/x64)
        env:
          CXX: ccache clang++
        run: make build TARGET_OS=windows TARGET_ARCH=x86_64

      - name: Package binaries
        run: |
          mkdir -p dist
          cp build/bwslc dist/bwslc-linux-x64
          cp build/bwslc-linux-arm64 dist/bwslc-linux-arm64
          cp build/bwslc-windows-x86_64.exe dist/bwslc-windows-x64.exe

      - name: Upload Linux x64 binary
        uses: actions/upload-artifact@v7
        with:
          name: bwslc-linux-x64
          path: dist/bwslc-linux-x64
          if-no-files-found: error

      - name: Upload Linux arm64 binary
        uses: actions/upload-artifact@v7
        with:
          name: bwslc-linux-arm64
          path: dist/bwslc-linux-arm64
          if-no-files-found: error

      - name: Upload Windows x64 binary
        uses: actions/upload-artifact@v7
        with:
          name: bwslc-windows-x64
          path: dist/bwslc-windows-x64.exe
          if-no-files-found: error

  macos:
    name: macos-latest
    needs: linux
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-latest-release

      - name: Compute version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "BWSL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # Commit date rather than wall clock, so every job agrees.
            date=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y%m%d)
            echo "BWSL_VERSION=nightly-$date-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      - name: Build bwslc
        env:
          CXX: ccache clang++
        run: make build

      - name: Package macOS binary
        id: package
        run: |
          arch=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          artifact_name="bwslc-macos-$arch"
          mkdir -p dist
          cp build/bwslc "dist/$artifact_name"
          chmod +x "dist/$artifact_name"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload macOS binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/bwslc-*
          if-no-files-found: error

  release:
    name: Release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bwslc-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "BWSL $version Open Beta" \
              --generate-notes \
              --verify-tag
          fi

      # Rolling dev build: one prerelease under the `nightly` tag, moved to
      # each new master commit, with its assets replaced in place so
      # releases/download/nightly/<asset> always serves the newest build.
      - name: Publish nightly release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/git/refs/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi

          notes="Development build from master at ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%d)). Not a stable release."
          if gh release view nightly >/dev/null 2>&1; then
            # Drop assets this build no longer produces, then replace the rest.
            gh release view nightly --json assets -q '.assets[].name' | while read -r asset; do
              [ -e "dist/$asset" ] || gh release delete-asset nightly "$asset" -y
            done
            gh release upload nightly dist/* --clobber
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes"
          else
            gh release create nightly dist/* \
              --prerelease \
              --title "Nightly" \
              --notes "$notes" \
              --verify-tag
          fi
