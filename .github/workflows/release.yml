name: Release

on:
  push:
    tags: ['v*']
    branches: [master]

# Dev builds share one rolling release, so a newer push supersedes an
# in-flight one. Tagged releases never cancel each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  # One job per target so the builds run in parallel rather than back to back.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            make_args: TARGET_OS=linux TARGET_ARCH=x86_64
            out: build/bwslc
            asset: bwslc-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            # The arm64 runner image is slimmer than ubuntu-latest; install
            # the compiler and the CMake used for SPIRV-Tools explicitly.
            apt: clang cmake
            make_args: TARGET_OS=linux TARGET_ARCH=arm64
            out: build/bwslc
            asset: bwslc-linux-arm64
          - target: windows-x64
            runner: ubuntu-latest
            apt: clang lld mingw-w64
            make_args: TARGET_OS=windows TARGET_ARCH=x86_64
            out: build/bwslc-windows-x86_64.exe
            asset: bwslc-windows-x64.exe
          - target: macos-arm64
            runner: macos-latest
            make_args: TARGET_OS=macos TARGET_ARCH=arm64
            out: build/bwslc
            asset: bwslc-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: release-${{ matrix.target }}

      - name: Compute version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "BWSL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # Commit date rather than wall clock, so every job agrees.
            date=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y%m%d)
            echo "BWSL_VERSION=dev-$date-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      - name: Install toolchain
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Build bwslc
        env:
          CXX: ccache clang++
        run: make build ${{ matrix.make_args }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp "${{ matrix.out }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: bwslc-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bwslc-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "BWSL $version Open Beta" \
              --generate-notes \
              --verify-tag
          fi

      # Rolling dev build: one prerelease under the `dev` tag, moved to
      # each new master commit, with its assets replaced in place so
      # releases/download/dev/<asset> always serves the newest build.
      - name: Publish dev release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/git/refs/tags/dev" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/dev -f sha="$GITHUB_SHA" >/dev/null
          fi

          notes="Development build from master at ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%d)). Not a stable release."
          if gh release view dev >/dev/null 2>&1; then
            # Drop assets this build no longer produces, then replace the rest.
            gh release view dev --json assets -q '.assets[].name' | while read -r asset; do
              [ -e "dist/$asset" ] || gh release delete-asset dev "$asset" -y
            done
            gh release upload dev dist/* --clobber
            gh release edit dev --prerelease --title "Dev" --notes "$notes"
          else
            gh release create dev dist/* \
              --prerelease \
              --title "Dev" \
              --notes "$notes" \
              --verify-tag
          fi
